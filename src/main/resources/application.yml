spring:
  application:
    name: chatlab-core

  datasource:
    url: jdbc:postgresql://localhost:5432/chatlab_db
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

chatlab:
  jwt:
    # Obrigatório: no mínimo 32 caracteres. Gere um com `openssl rand -hex 32`.
    secret: ${CHATLAB_JWT_SECRET:}
    expiration-minutes: ${CHATLAB_JWT_EXPIRATION_MINUTES:60}
