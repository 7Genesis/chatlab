name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Os testes sobem um PostgreSQL com Testcontainers; o runner do GitHub já tem Docker.
      - name: Build e testes
        run: ./mvnw -B verify
